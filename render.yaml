services:
  # MCP Server 1: Tier 1 Data Only (Project Details Only)
  - type: web
    name: llm-portfolio-mcp1
    env: node
    plan: free
    buildCommand: npm install && npm run index
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SERVER_NAME
        value: llm-portfolio-mcp1
      - key: ALLOWED_TIERS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-wiki-db
          property: connectionString

  # MCP Server 2: Tier 1 & Tier 2 Data (Projects + Skills & Introduction)
  - type: web
    name: llm-portfolio-mcp2
    env: node
    plan: free
    buildCommand: npm install && npm run index
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SERVER_NAME
        value: llm-portfolio-mcp2
      - key: ALLOWED_TIERS
        value: "1,2"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-wiki-db
          property: connectionString

  # MCP Server 3: Tier 1, Tier 2 & Tier 3 Data (Projects + Skills + Contact Details & Personal Data - Full Access)
  - type: web
    name: llm-portfolio-mcp3
    env: node
    plan: free
    buildCommand: npm install && npm run index
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SERVER_NAME
        value: llm-portfolio-mcp3
      - key: ALLOWED_TIERS
        value: "1,2,3"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-wiki-db
          property: connectionString

databases:
  - name: portfolio-wiki-db
    plan: free
    databaseName: portfolio_wiki
    user: portfolio_user
