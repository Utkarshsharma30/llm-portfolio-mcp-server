services:
  - type: web
    name: llm-portfolio-mcp-server
    env: node
    plan: free
    buildCommand: npm install && npm run index
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-wiki-db
          property: connectionString

databases:
  - name: portfolio-wiki-db
    plan: free
    databaseName: portfolio_wiki
    user: portfolio_user
